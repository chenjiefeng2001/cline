name: sdk-test

on:
    push:
        branches:
            - main
        paths:
            - "sdk/**"
            - ".github/workflows/sdk-test.yml"
    workflow_dispatch:
    pull_request:
        branches:
            - main
        paths:
            - "sdk/**"
            - ".github/workflows/sdk-test.yml"
    workflow_call:

permissions:
    contents: read

defaults:
    run:
        working-directory: .

jobs:
    quality-checks:
        runs-on: ubuntu-latest
        name: Quality Checks
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.13"

            - name: Install dependencies
              run: bun install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Typecheck
              run: |
                  bun run build:sdk
                  bun run -F @cline/cli build
                  bun run types

            - name: Lint & Format
              run: bun run lint

    test:
        needs: quality-checks
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      node-version: "24.x"
                    - os: windows-latest
                      node-version: "24.x"
        runs-on: ${{ matrix.os }}
        name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.13"

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: bun install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build SDK
              id: build_sdk_step
              run: bun run build:sdk

            - name: Build CLI
              id: build_cli_step
              if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' }}
              run: bun -F @cline/cli build

            - name: Run Tests
              if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' && steps.build_cli_step.outcome == 'success' && matrix.os != 'windows-latest' }}
              run: bun run test

            - name: Run SDK Tests (Windows)
              if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' && steps.build_cli_step.outcome == 'success' && matrix.os == 'windows-latest' }}
              run: bun -F './sdk/packages/**' test

            - name: Smoke test SQLite under Node
              if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' && matrix.os != 'windows-latest' }}
              timeout-minutes: 10
              run: bun sdk/scripts/ci-node-smoke.ts

            - name: Run TUI e2e tests
              if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' && steps.build_cli_step.outcome == 'success' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x' }}
              run: bun -F @cline/cli test:e2e:cli:tui

            - name: Verify packages are publishable
              if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' && steps.build_cli_step.outcome == 'success' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x' }}
              run: bun sdk/scripts/check-publish.ts

    # PR gate for the agent behavioural contract. The model-based smoke tests
    # under evals/ need a live provider, so they cannot gate a pull request.
    # This job runs the deterministic, offline conformance suite instead: no
    # network, no secret, no clock-sensitive assertion, so a failure is a
    # behaviour change rather than noise. It also fails when a case is deleted
    # from the registry without editing the pinned baseline, so coverage cannot
    # be silently dropped.
    agent-conformance:
        needs: quality-checks
        runs-on: ubuntu-latest
        name: Agent Conformance Gate
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.13"

            - name: Install dependencies
              run: bun install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Sibling packages resolve through dist/, so the suite must run
            # against a build rather than stale output.
            - name: Build SDK
              run: bun run build:sdk

            - name: Run agent conformance gate
              run: bun -F @cline/core test:unit -- --run src/eval

    extended-tests:
        needs: quality-checks
        runs-on: ubuntu-latest
        name: Extended Tests (webview-ui, desktop-app, multi-agent, rollout, vscode examples)
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.13"

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.x"

            - name: Install dependencies
              run: bun install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build SDK
              run: bun run build:sdk

            - name: Build CLI
              run: bun -F @cline/cli build

            # apps/vscode/src/shared/proto/ and src/generated/ are gitignored
            # build products (build-proto.mjs), but the webview-ui suite imports
            # them through the `@shared/proto/*` alias. On a fresh checkout they
            # do not exist, so without this step vite fails to resolve
            # "@shared/proto/cline/common" and 25 of 48 webview-ui suites fail to
            # collect. The ext-vscode-test job gets this for free because
            # `ci:build` starts with `protos`; this job does not, so it has to
            # ask. Local runs hide the problem: a developer who has built the
            # extension already has the generated files on disk.
            - name: Generate protobufs
              working-directory: apps/vscode
              run: bun run protos

            # Deterministic serial chain (webview-ui → desktop-app → multi-agent
            # → rollout → examples/vscode) covering the suites outside the
            # default `test` aggregator. Default `test` semantics unchanged.
            - name: Run Extended Tests
              run: bun run test:extended
